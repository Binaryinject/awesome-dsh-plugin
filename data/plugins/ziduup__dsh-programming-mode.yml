url: https://github.com/ziduup/dsh-programming-mode
name: ziduup/dsh-programming-mode
category: workflow
description:
  en: 'Programming Mode agent preset bundle: the standard coding agent with its persona mandating the Superpowers discipline (skills first, brainstorming before building, plans before code, TDD, systematic debugging, verification before completion) plus an always-on Ponytail code-volume discipline (7-rung minimal-code ladder, default full); ships all twenty skills bundled (14 superpowers + 6 ponytail) and mechanically injects the full using-superpowers skill into every new session''s first request. v0.3.1 fixes a deadlock where implementer subagents asking mid-turn questions would block waiting for a same-turn reply: the implementer template now follows a decide-and-record protocol instead.'
  zh: '编程模式 agent preset 组合包：标准编码 Agent 强制执行 Superpowers 工程纪律（技能优先、先头脑风暴、先计划后编码、TDD、系统化调试、完成前验证），并常驻 Ponytail 代码量纪律（7 级最小化阶梯，默认 full）；内置全部 20 个技能（14 superpowers + 6 ponytail），并在每个新会话的第一条请求前自动注入 using-superpowers 技能全文。v0.3.1 修复了实施者子代理中途提问导致的死锁——本 harness 的 send_message 只能在子代理下一回合送达，原模板的"ask questions"措辞在此不可达，现改为 decide-and-record 协议。'
